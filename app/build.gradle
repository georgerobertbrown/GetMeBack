allprojects {
    repositories {
        maven { url 'https://jitpack.io' }
    }
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.2'
    }
}

apply plugin: 'com.android.application'

repositories {
    google()
    mavenCentral()
}

def currentDatestamp = new Date().format("yyMMdd")
def currentTimestamp = new Date().format("HHmm")

android {
    compileSdkVersion 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.gncbrown.GetMeBack"
        minSdkVersion 35
        targetSdkVersion 35
        versionCode 4
        versionName "1.5.3-${currentDatestamp}${currentTimestamp}"

        multiDexEnabled true
    }
    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type. Make sure to use a build
            // variant with `debuggable false`.
            minifyEnabled true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources true


            //minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    namespace 'com.gncbrown.GetMeBack'
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'

    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.google.android.gms:play-services-maps:19.1.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.karumi:dexter:5.0.0'
    implementation "com.google.android.material:material:1.12.0"
    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation 'com.android.support:multidex:1.0.3'
}
